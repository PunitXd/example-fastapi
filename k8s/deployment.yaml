apiVersion: apps/v1
kind: Deployment
metadata:
  name: punitxd-example-fastapi
  namespace: kairo-punitxd-example-fastapi
  labels:
    app: punitxd-example-fastapi
    app.kubernetes.io/managed-by: kairo
spec:
  replicas: 1
  # rollback needs old ReplicaSets to still be around
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: punitxd-example-fastapi
  template:
    metadata:
      labels:
        app: punitxd-example-fastapi
        app.kubernetes.io/managed-by: kairo
    spec:
      containers:
        - name: punitxd-example-fastapi
          image: kairo/punitxd-example-fastapi:f85072a17ed3c9b602ccb334eb28cf9bd19f4457
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # liveness + memory limit are what make self-healing possible.
          # don't remove them without talking to BE 2
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
